name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # Required for npm trusted publishing via OIDC
    steps:
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${GITHUB_REF_NAME}' does not match vX.Y.Z format"
            exit 1
          fi

          echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" != "${{ steps.version.outputs.value }}" ]]; then
            echo "Error: package version '${package_version}' does not match tag '${GITHUB_REF_NAME}'"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build:browser
      - name: Pack
        id: pack
        shell: bash
        run: |
          package_file="$(npm pack --ignore-scripts --silent)"
          echo "package_file=${package_file}" >> "${GITHUB_OUTPUT}"
      - name: Generate checksum
        run: shasum -a 256 "${{ steps.pack.outputs.package_file }}" > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes "${{ steps.pack.outputs.package_file }}" checksums.txt
      - name: Publish to npm
        run: npm publish "./${{ steps.pack.outputs.package_file }}" --access public
